<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.PageTitle}}</title>
    <style>
        body {
            background-color: #f0f0f0;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>{{.PageTitle}}</h1>
        {{range .Notes}}
        <div style="background: white; padding: 10px; margin: 10px 0;">
            <h3>{{.Title}}</h3>
            <p>{{.Content}}</p>
        </div>
        {{else}}
            <p>Заметок нет</p>
        {{end}}
</body>
</html>
